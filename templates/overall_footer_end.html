<!-- BEGIN switch_facebook_login -->
<div id="fb-root"></div>
<script>
	$(function () {
		$('div.fb-login-button, span.fb-login-button').attr({
			"data-scope": "{switch_facebook_login.FB_SCOPE}",
			"data-max-rows": "{switch_facebook_login.FB_MAX_ROWS}",
			"data-size": "{switch_facebook_login.FB_BUTTON_SIZE}",
			"data-show-faces": "{switch_facebook_login.FB_SHOW_FACES}",
			"data-auto-logout-link": "{switch_facebook_login.FB_AUTO_LOGOUT}"
		});
		$('div.fb-login-button, span.fb-login-button').each(function () {
			if (!$(this).attr('onlogin')) $(this).attr('onlogin', '{switch_facebook_login.FB_ONLOGIN}');
			if ($(this).html() == '') $(this).html('{switch_facebook_login.FB_LABEL}');
		});
		FB.init({
			"appId": "{switch_facebook_login.FB_APP_ID}",
			"cookie": {switch_facebook_login.FB_COOKIE},
			"xfbml": {switch_facebook_login.FB_XFBML},
			"oauth": {switch_facebook_login.FB_OAUTH},
			"version": "{switch_facebook_login.FB_VERSION}"
		});
		(function (d, s, id) {
			var js, fjs = d.getElementsByTagName(s)[0];
			if (d.getElementById(id)) return;
			js = d.createElement(s); js.id = id;
			js.src = "https://connect.facebook.net/{switch_facebook_login.FB_LOCAL}/sdk.js";
			fjs.parentNode.insertBefore(js, fjs);
		}(document, 'script', 'facebook-jssdk'));
	});
	function onLoginFB() {
		window.location.replace('{switch_facebook_login.FB_ONLOGIN_URL}');
	}
</script>
<!-- END switch_facebook_login -->

<!-- Le dock : les plugins dans des panneaux flottants, ouverts par des onglets au bord droit.
     data-plugin : l'objet que le plugin installe ; sans lui, l'onglet et le panneau disparaissent.
     Un plugin configuré avec manuel: true n'est lancé qu'à la première ouverture de son panneau.
     Les scripts des plugins se chargent à la toute fin de ce template. -->
<div class="fal-dock" id="fal-dock">
	<div class="fal-dock__onglets" role="toolbar" aria-label="Widgets" aria-orientation="vertical">
		<button type="button" class="fal-dock__onglet" aria-controls="fal-dock-updates" aria-expanded="false">Derniers sujets</button>
		<button type="button" class="fal-dock__onglet" aria-controls="fal-dock-feed" aria-expanded="false">Le fil</button>
	</div>
	<section class="fal-dock__panneau fal-categorie" id="fal-dock-updates" data-plugin="FAUpdates" data-config="FA_UPDATES_CONFIG" aria-label="Derniers sujets" hidden>
		<header class="fal-categorie__entete">
			<h2 class="fal-categorie__titre">Derniers sujets</h2>
			<button type="button" class="fal-dock__fermer" aria-label="Fermer" title="Fermer"></button>
		</header>
		<div class="fal-dock__corps"><div id="fa-updates"></div></div>
	</section>
	<section class="fal-dock__panneau fal-categorie" id="fal-dock-feed" data-plugin="FAFeed" data-config="FA_FEED_CONFIG" aria-label="Le fil" hidden>
		<header class="fal-categorie__entete">
			<h2 class="fal-categorie__titre">Le fil</h2>
			<button type="button" class="fal-dock__fermer" aria-label="Fermer" title="Fermer"></button>
		</header>
		<div class="fal-dock__corps"><div id="fa-feed"></div></div>
	</section>
</div>

<script>
	(function () {
		var dock = document.getElementById('fal-dock');
		if (!dock) return;
		var CLE = 'fal-dock';

		function lire() { try { return localStorage.getItem(CLE); } catch (e) { return null; } }
		function ecrire(v) { try { if (v) localStorage.setItem(CLE, v); else localStorage.removeItem(CLE); } catch (e) { void e; } }

		function brancher() {
			[].slice.call(dock.querySelectorAll('.fal-dock__onglet')).forEach(function (o) {
				var p = document.getElementById(o.getAttribute('aria-controls'));
				if (!p || !window[p.dataset.plugin]) {
					o.remove();
					if (p) p.remove();
				}
			});
			var onglets = [].slice.call(dock.querySelectorAll('.fal-dock__onglet'));
			if (!onglets.length) { dock.remove(); return; }
			document.documentElement.classList.add('fal-avec-dock');

			function panneau(o) { return document.getElementById(o.getAttribute('aria-controls')); }

			function fermer(o, rendre) {
				var p = panneau(o);
				if (p.hidden) return;
				p.hidden = true;
				o.setAttribute('aria-expanded', 'false');
				if (!dock.querySelector('.fal-dock__panneau:not([hidden])')) { dock.classList.remove('fal-dock--ouvert'); ecrire(null); }
				if (rendre) o.focus();
			}

			function ouvrir(o, focus) {
				onglets.forEach(function (x) { if (x !== o) fermer(x); });
				var p = panneau(o);
				p.hidden = false;
				o.setAttribute('aria-expanded', 'true');
				dock.classList.add('fal-dock--ouvert');
				ecrire(p.id);
				var plugin = window[p.dataset.plugin], conf = window[p.dataset.config];
				if (!p.dataset.lance && conf && conf.manuel && plugin.init) {
					p.dataset.lance = '1';
					plugin.init(conf);
				}
				if (focus) p.querySelector('.fal-dock__fermer').focus();
			}

			onglets.forEach(function (o) {
				o.addEventListener('click', function () {
					if (panneau(o).hidden) ouvrir(o, true); else fermer(o);
				});
				panneau(o).querySelector('.fal-dock__fermer').addEventListener('click', function () { fermer(o, true); });
			});

			dock.addEventListener('keydown', function (ev) {
				if (ev.key !== 'Escape') return;
				onglets.forEach(function (o) { if (!panneau(o).hidden) fermer(o, true); });
			});

			var memo = lire();
			onglets.forEach(function (o) { if (o.getAttribute('aria-controls') === memo) ouvrir(o, false); });
		}

		if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', brancher);
		else brancher();
	})();
</script>

<script>
	(function () {
		var boite = document.getElementById('fal-compte');
		if (!boite) return;
		function fusionner() {
			var droite = document.getElementById('fa_right');
			if (!droite) return false;
			['fa_menu', 'fa_notifications', 'notif_list', 'live_notif'].forEach(function (id) {
				var e = document.getElementById(id);
				if (e) boite.appendChild(e);
			});
			function recopier() {
				var c = droite.className;
				boite.setAttribute('data-ouvert', /\bnotification\b/.test(c) ? 'notifications' : (/\bwelcome\b/.test(c) ? 'compte' : ''));
			}
			new MutationObserver(recopier).observe(droite, { attributes: true, attributeFilter: ['class'] });
			recopier();
			document.documentElement.classList.add('fal-barre-fusionnee');
			return true;
		}
		if (!fusionner()) {
			var guet = new MutationObserver(function () { if (fusionner()) guet.disconnect(); });
			guet.observe(document.body, { childList: true, subtree: true });
			setTimeout(function () { guet.disconnect(); }, 10000);
		}
	})();
	fa_endpage();
	<!-- BEGIN switch_webpush_notifications -->
	if ('serviceWorker' in navigator && 'PushManager' in window && navigator.userAgent.includes('Mac') && Notification.permission === 'default' && window.matchMedia('(display-mode: standalone)').matches) {
		window.addEventListener('DOMContentLoaded', function () {
			var bouton = document.createElement('span');
			bouton.id = 'sub-to-pushs';
			bouton.innerHTML = '{switch_webpush_notifications.INSCRIPTION_PUSH_NOTIFICATIONS}';
			document.querySelector('#page-footer .footer-home').append(bouton);
			bouton.addEventListener('click', async function () {
				if (await window.Notification.requestPermission() === 'granted') subscribeUser();
			});
		});
	}
	<!-- END switch_webpush_notifications -->
</script>
